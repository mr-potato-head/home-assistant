views:
  - title: Home
    type: panel
    theme: slate
    cards:
    - type: vertical-stack
      cards:
      - type: horizontal-stack
        cards:
        - type: horizontal-stack
          cards:
          - align_icon: left
            align_state: center
            entities:
              - sensor.zwave_capteur_temperature_exterieur_temperature
            font_size: 100
            icon: 'mdi:sun-thermometer-outline'
            name: Température
            show:
              fill: false
            hours_to_show: 24
            points_per_hour: 2
            color_thresholds:
            - value: -50
              color: "#33DCCF"
            - value: 0
              color: "#82E0AA"
            - value: 15
              color: "#F7DC6F"
            - value: 23
              color: "#E74C3C"
            - value: 30
              color: "#922B21"
            type: 'custom:mini-graph-card'

          - align_icon: left
            align_state: center
            entities:
              - sensor.zwave_capteur_temperature_exterieur_humidite
            font_size: 100
            icon: 'mdi:water-percent'
            name: Humidité
            show:
              fill: false
            hours_to_show: 24
            points_per_hour: 2
            color_thresholds:
            - value: 0
              color: "#33DCCF"
            - value: 50
              color: "#82E0AA"
            - value: 70
              color: "#F7DC6F"
            - value: 85
              color: "#E74C3C"
            - value: 90
              color: "#922B21"
            type: 'custom:mini-graph-card'
        #- type: weather-forecast
        #  entity: weather.openweathermap

        - type: vertical-stack
          cards:
            - type: custom:button-card
              entity: sensor.time_fr
              show_icon: false
              show_state: true
              show_name: false
              size: 40%
              styles:
                state:
                  - font-size: 90px
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: input_select.input_select_mode_maison
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.input_select_mode_maison
                      option: Travail
                  icon: mdi:office-building
                  show_icon: true
                  show_state: false
                  show_name: false
                  size: 50%
                  #layout: icon_name_state
                  styles:
                    icon:
                      - color: |
                          [[[
                            if (entity.state === "Travail") return 'lightblue';
                            else return '';
                          ]]]
                    card:
                      - height: 75px
                  #aspect_ratio: 1/1
                - type: custom:button-card
                  entity: input_select.input_select_mode_maison
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.input_select_mode_maison
                      option: Télétravail
                  icon: mdi:laptop
                  show_icon: true
                  show_state: false
                  show_name: false
                  size: 50%
                  #layout: icon_name_state
                  styles:
                    icon:
                      - color: |
                          [[[
                            if (entity.state === "Télétravail") return 'lightblue';
                            else return '';
                          ]]]
                    card:
                      - height: 75px
                  #aspect_ratio: 1/1
                - type: custom:button-card
                  entity: input_select.input_select_mode_maison
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.input_select_mode_maison
                      option: Weekend
                  icon: mdi:home
                  show_icon: true
                  show_state: false
                  show_name: false
                  size: 50%
                  #layout: icon_name_state
                  styles:
                    icon:
                      - color: |
                          [[[
                            if (entity.state === "Weekend") return 'lightblue';
                            else return '';
                          ]]]
                    card:
                      - height: 75px
                  #aspect_ratio: 1/1
                - type: custom:button-card
                  entity: input_select.input_select_mode_maison
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.input_select_mode_maison
                      option: Vacances
                  icon: mdi:umbrella-beach
                  show_icon: true
                  show_state: false
                  show_name: false
                  size: 50%
                  #layout: icon_name_state
                  styles:
                    icon:
                      - color: |
                          [[[
                            if (entity.state === "Vacances") return 'lightblue';
                            else return '';
                          ]]]
                    card:
                      - height: 75px
                  #aspect_ratio: 1/1

        - align_icon: left
          align_state: center
          entities:
            - sensor.zwave_capteur_energie_electrique_puissance_w
          font_size: 100
          icon: 'mdi:home-lightning-bolt-outline'
          name: Puissance instantanée
          show:
            fill: false
          hours_to_show: 3
          points_per_hour: 20
          color_thresholds:
          - value: 0
            color: "#82E0AA"
          - value: 2500
            color: "#DC7633"
          - value: 7000
            color: "#CB4335"
          type: 'custom:mini-graph-card'

      - type: horizontal-stack
        cards:
        - type: vertical-stack
          cards:
          - type: horizontal-stack
            cards:
            - type: custom:button-card
              entity: switch.zwave_prise_imprimantes_3d
              name: Imprimantes 3D
              icon: mdi:printer-3d
              tap_action:
                action: none
              size: 40%
              styles:
                icon:
                  - color: |
                      [[[
                        if (entity.state === 'on') return 'lightgreen';
                        else return 'grey';
                      ]]]
                card:
                  - height: 110px
            - type: custom:button-card
              entity: binary_sensor.zwave_capteur_fumee_imprimantes_3d_alarme_fumee
              name: Fumée
              tap_action:
                action: none
              icon: |
                [[[
                  if (entity.state === 'on') return 'mdi:smoke';
                  else return 'mdi:smoke-detector-variant';
                ]]]
              size: 40%
              styles:
                icon:
                  - color: |
                      [[[
                        if (entity.state === 'on') return 'red';
                        else return 'lightgreen';
                      ]]]
                card:
                  - height: 110px
          # Seconde rangee : elle comble le vide laisse par la carte meteo et
          # donne a cette colonne la meme structure que la grille de lumieres
          # a droite, deux rangees de 110 px.
          - type: horizontal-stack
            cards:
            - type: custom:button-card
              entity: switch.zwave_switch_pompe_on_off
              name: Pompe
              icon: mdi:water-pump
              tap_action:
                action: none
              size: 40%
              styles:
                icon:
                  - color: |
                      [[[
                        if (entity.state === 'on') return 'lightblue';
                        else return 'grey';
                      ]]]
                card:
                  - height: 110px
            - type: custom:button-card
              entity: alarm_control_panel.alarm
              name: Alarme
              icon: |
                [[[
                  if (entity.state === 'disarmed') return 'mdi:shield-off-outline';
                  if (entity.state === 'triggered') return 'mdi:shield-alert';
                  return 'mdi:shield-check';
                ]]]
              size: 40%
              styles:
                icon:
                  - color: |
                      [[[
                        if (entity.state === 'triggered') return 'red';
                        if (entity.state === 'disarmed') return 'grey';
                        return 'lightgreen';
                      ]]]
                card:
                  - height: 110px

        - type: vertical-stack
          cards:
          # TEST card-mod : 'style:' est la cle de card-mod 2, renommee en
          # 'card_mod:' en version 3. Si ce titre se centre et perd son fond
          # alors que les autres restent a gauche, la v3 est confirmee et il
          # faudra renommer la cle sur les sept cartes.
          - content: |
              # Salon
            card_mod:
              style:
                .: |
                  ha-card {
                    background-color: transparent !important;
                    box-shadow: none !important;
                  }
                ha-markdown:
                  $: |
                    h1 {
                      font-size: 28px;
                    # font-weight: bold;
                      text-align: center;
                      letter-spacing: '-0.01em';
                    }
            type: markdown
          - type: custom:button-card
            entity: sensor.zigbee_capteur_temperature_salon_temperature
            show_icon: false
            show_state: true
            show_name: false
            styles:
              state:
                - font-size: 38px
              card:
                - height: 75px
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                tap_action:
                  action: call-service
                  service: script.temperature_down
                  service_data:
                    climate_id: climate.thermostat_salon
                    value: 0.5
                icon: mdi:thermometer-minus
                show_name: false
                size: 15%
                aspect_ratio: 3/1
                styles:
                  icon:
                    - color: lightblue
              - type: custom:button-card
                entity: sensor.consigne_salon
                show_icon: false
                show_state: true
                show_name: false
                styles:
                  state:
                    - font-size: 24px
                aspect_ratio: 3/1
              - type: custom:button-card
                tap_action:
                  action: call-service
                  service: script.temperature_up
                  service_data:
                    climate_id: climate.thermostat_salon
                    value: 0.5
                icon: mdi:thermometer-plus
                size: 15%
                aspect_ratio: 3/1
                styles:
                  icon:
                    - color: lightcoral
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: sensor.doors_count_salon
                icon: |
                  [[[
                    if (entity.state > 0) return 'mdi:door-open';
                    else return 'mdi:door-closed';
                  ]]]
                show_icon: true
                show_state: false
                show_name: false
                size: 30%
                #layout: icon_name_state
                styles:
                  icon:
                    - color: |
                        [[[
                          if (entity.state > 0) return 'lightcoral';
                          else return '';
                        ]]]
                  card:
                    - height: 60px
              - type: custom:button-card
                entity: sensor.windows_count_salon
                icon: |
                  [[[
                    if (entity.state > 0) return 'mdi:window-open-variant';
                    else return 'mdi:window-closed-variant';
                  ]]]
                show_icon: true
                show_state: false
                show_name: false
                size: 30%
                #layout: icon_name_state
                styles:
                  icon:
                    - color: |
                        [[[
                          if (entity.state > 0) return 'lightcoral';
                          else return '';
                        ]]]
                  card:
                    - height: 60px
              - type: custom:button-card
                entity: switch.switch_radiateur_salon
                icon: |
                  [[[
                    if (entity.state === 'off')
                      return 'mdi:radiator-off';
                    else
                      return 'mdi:radiator';
                  ]]]
                show_icon: true
                show_state: false
                show_name: false
                size: 30%
                #layout: icon_name_state
                styles:
                  icon:
                    - color: |
                        [[[
                          if (entity.state === 'off')
                            return '';
                          else
                            return 'lightcoral';
                        ]]]
                  card:
                    - height: 60px

        - type: grid
          square: false
          cards:
            - type: custom:button-card
              tap_action:
                action: toggle
              entity: cover.garage_door
              name: Garage
              size: 60%
              styles:
                card:
                  - height: 110px
            - type: custom:button-card
              tap_action:
                action: toggle
              entity: light.terrasse
              name: Terasse
              size: 60%
              styles:
                card:
                  - height: 110px
            - type: custom:button-card
              tap_action:
                action: toggle
              entity: light.lumieres_salon
              name: Salon
              size: 60%
              styles:
                card:
                  - height: 110px
            - type: custom:button-card
              tap_action:
                action: toggle
              entity: light.zigbee_ampoule_entree_on_off
              name: Entrée
              size: 60%
              styles:
                card:
                  - height: 110px
            - type: custom:button-card
              tap_action:
                action: toggle
              entity: light.nord
              name: Nord
              size: 60%
              styles:
                card:
                  - height: 110px
            - type: custom:button-card
              tap_action:
                action: toggle
              entity: light.garage
              name: Garage
              size: 60%
              styles:
                card:
                  - height: 110px

