
# Core Home Assistant integrations enabled through default_config.
default_config:

# Text-to-speech providers.
tts:
  - platform: google_translate

# Group definitions loaded from the standard include file.
group: !include groups.yaml
# Automation definitions loaded from the standard include file.
automation: !include automations.yaml
# Scene definitions loaded from the standard include file.
scene: !include scenes.yaml

# Lovelace dashboard configuration.
lovelace:
  mode: storage
  # Register YAML-backed Lovelace dashboards.
  dashboards:
    lovelace-yaml:
      mode: yaml
      title: YAML
      icon: mdi:script
      show_in_sidebar: true
      filename: lovelace.yaml

# Frontend theme configuration.
frontend:
  themes: !include_dir_merge_named themes

#####################################################################
# Climate Entities
#####################################################################

climate:
