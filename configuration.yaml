# Utility scripts for dashboard temperature controls.
script:
  temperature_up:
    sequence:
    - service: climate.set_temperature
      data_template:
        entity_id: "{{ climate_id }}"
        temperature: "{{ state_attr(climate_id, 'temperature') | float + value }}"
  temperature_down:
    sequence:
    - service: climate.set_temperature
      data_template:
        entity_id: "{{ climate_id }}"
        temperature: "{{ state_attr(climate_id, 'temperature') | float - value  }}"
